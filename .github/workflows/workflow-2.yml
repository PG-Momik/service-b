name: Workflow 2

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_call:
    inputs:
      concurrency_group:
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  job-1:
    name: Required check 1
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Dummy step 2
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' &&
          !contains(fromJSON('["dev", "staging", "main", "master"]'), github.head_ref))
        uses: PG-Momik/shared-actions/actions/action-5@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 3
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' &&
          !contains(fromJSON('["dev", "staging", "main", "master"]'), github.head_ref))
        run: echo "dummy step"
      - name: Dummy step 4
        uses: PG-Momik/shared-actions/actions/action-6@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 5
        run: echo "dummy step"

      - name: Dummy step 6
        run: echo "dummy step"

  job-2:
    name: Required check 2
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-6@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 3
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-7@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 4
        run: echo "dummy step"

      - name: Dummy step 5
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-9@f6f631ccbbc35aa4aa977144bebd38a70261225b

  job-3:
    name: Required check 3
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-6@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 3
        run: echo "dummy step"

  job-4:
    name: Required check 4
    runs-on: ubuntu-latest
    needs: [job-1, job-2, job-3]
    if: github.event_name != 'workflow_call'
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dummy step 2
        run: echo "dummy step"

      - name: Dummy step 3
        run: echo "dummy step"
