name: '[Updated] Workflow 3'

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step 1
        uses: PG-Momik/shared-actions/actions/action-2@6d62a381cd9f6617452293412561dd59f323a108
        with:
          use-master: false
          branch-rules: |
            main:feature/xp-*,hotfix/xp-*
