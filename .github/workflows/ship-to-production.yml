name: Ship to production

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: Release branch to ship
        required: true
        type: string

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: ship-to-production

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: ship-to-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: PG-Momik/shared-actions/actions/ship-to-production@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          release-branch: ${{ inputs.release-branch }}
          deploy-workflow: workflow-1.yml
