name: Workflow 1

permissions:
  id-token: write
  contents: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  job-1:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.step-1.outputs.environment }}
    steps:
      - name: Dummy step 1
        id: step-1
        uses: PG-Momik/shared-actions/actions/action-1@main

  job-2:
    name: Job 2
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'dev'
    steps:
      - name: Dummy step 1
        run: echo "dummy step"

  job-3:
    name: Job 3
    needs: [job-2]
    uses: ./.github/workflows/workflow-2.yml
    secrets: inherit
    with:
      concurrency_group: deploy-ci-${{ github.ref }}

  job-4:
    name: Job 4
    needs: [job-3, job-1]
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}

    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Dummy step 2
        id: step-1
        run: echo "dummy step"

      - name: Dummy step 3
        uses: PG-Momik/shared-actions/actions/action-6@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

      - name: Dummy step 4
        run: echo "dummy step"

      - name: Dummy step 5
        run: echo "dummy step"

      - name: Dummy step 6
        run: echo "dummy step"

      - name: Dummy step 7
        id: step-2
        run: echo "dummy step"

      - name: Dummy step 8
        run: echo "dummy step"

      - name: Dummy step 9
        run: echo "dummy step"

      - name: Dummy step 10
        run: echo "dummy step"

      - name: Dummy step 11
        id: step-3
        run: echo "dummy step"

      - name: Dummy step 12
        run: echo "dummy step"

      - name: Dummy step 13
        continue-on-error: true
        id: step-4
        run: echo "dummy step"

      - name: Dummy step 14
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-4@main

      - name: Dummy step 15
        if: always()
        uses: PG-Momik/shared-actions/actions/action-8@main

  job-5:
    name: Job 5
    needs: [job-4, job-1]
    if: github.ref_name == 'main' && needs.job-4.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-3@4fb866cd843bb1af966132c7d5f71d9d56f07bb3
