name: '[Updated] Workflow 1'

permissions:
  contents: read
  actions: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'

jobs:
  job-1:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.step-1.outputs.environment }}
      release-branch: ${{ steps.step-1.outputs.release-branch }}
    steps:
      - name: Dummy step 1
        id: step-1
        uses: PG-Momik/shared-actions/actions/action-1@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          trunk-based: 'true'
          version-scheme: calver

  job-2:
    name: Job 2
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step 1
        run: echo "dummy step"

  job-3:
    name: Job 3
    needs: [job-2]
    uses: ./.github/workflows/workflow-2.yml
    secrets: inherit
    with:
      concurrency_group: deploy-ci-${{ github.ref }}

  job-4:
    name: Job 4
    needs: [job-3, job-1]
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.job-1.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Dummy step 2
        id: step-1
        run: echo "dummy step"

      - name: Promote staged image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          digest=$(bash scripts/demo-image.sh check "$GITHUB_SHA")
          echo "Promoted staged image $digest for $GITHUB_SHA"

      - name: Dummy step 3
        uses: PG-Momik/shared-actions/actions/action-6@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 4
        run: echo "dummy step"

      - name: Dummy step 5
        run: echo "dummy step"

      - name: Dummy step 6
        run: echo "dummy step"

      - name: Dummy step 7
        id: step-2
        run: echo "dummy step"

      - name: Dummy step 8
        run: echo "dummy step"

      - name: Dummy step 9
        run: echo "dummy step"

      - name: Dummy step 10
        run: echo "dummy step"

      - name: Dummy step 11
        id: step-3
        run: echo "dummy step"

      - name: Dummy step 12
        run: echo "dummy step"

      - name: Dummy step 13
        continue-on-error: true
        id: step-4
        run: echo "dummy step"

      - name: Dummy step 14
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-4@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Dummy step 15
        if: always()
        uses: PG-Momik/shared-actions/actions/action-8@f6f631ccbbc35aa4aa977144bebd38a70261225b

      - name: Record staged image
        if: startsWith(github.ref, 'refs/heads/release/')
        run: bash scripts/demo-image.sh stage "$GITHUB_SHA"
        env:
          STAGED_DIR: staged

      - name: Save staged image
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: staged/

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: PG-Momik/shared-actions/actions/action-3@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          github-release: draft

  job-5:
    name: Job 5
    needs: [job-4, job-1]
    if: startsWith(github.ref, 'refs/tags/v') && needs.job-4.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-3@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          existing-tag: 'true'
          github-release: publish

      - name: Delete shipped release branch
        env:
          RELEASE_BRANCH: ${{ needs.job-1.outputs.release-branch }}
        run: git push origin --delete "$RELEASE_BRANCH"
