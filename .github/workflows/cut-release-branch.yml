name: Cut release branch

on:
  workflow_dispatch:
    inputs:
      hotfix-from-tag:
        description: Production tag to patch, leave blank for a normal release
        required: false
        type: string
      patch-of:
        description: Release to patch when rolling back
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-release-branch

jobs:
  cut:
    runs-on: ubuntu-latest
    environment: cut-release-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: PG-Momik/shared-actions/actions/cut-release-branch@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          version-scheme: calver
          hotfix-from-tag: ${{ inputs.hotfix-from-tag }}
          patch-of: ${{ inputs.patch-of }}
          deploy-workflow: workflow-1.yml
