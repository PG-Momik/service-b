name: Check release branch fix

on:
  pull_request:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  check-release-branch-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: PG-Momik/shared-actions/actions/check-release-branch-fix@f6f631ccbbc35aa4aa977144bebd38a70261225b
        with:
          base-branch: ${{ github.base_ref }}
